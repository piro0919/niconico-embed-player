name: Publish

# Publish only when a tag is pushed, after checking it matches package.json.
# 0.1.0 was published by hand, since npm's trusted publisher settings open
# only once a package exists.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $tag does not match package.json version $pkg" >&2
            exit 1
          fi
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build:lib
      - run: pnpm check:package
      # Trusted publishing (OIDC): no token. npm needs 11.5.1 or later for it,
      # and provenance is attached automatically.
      - run: npm install -g npm@11.21.1
      - name: Skip a version already on npm
        id: published
        run: |
          if npm view "niconico-embed-player@${GITHUB_REF_NAME#v}" version | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
